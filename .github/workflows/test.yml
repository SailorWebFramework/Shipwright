name: Shipwright Codegen Tests

on:
  push:
    branches: [feature-fin-v2, main]
  pull_request:

jobs:
  shipwright-tests:
    name: Shipwright Codegen Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Run Shipwright codegen tests
        run: pytest tests/ -v --tb=short
